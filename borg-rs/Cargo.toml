[workspace]
resolver = "2"
members = [
    "borg-core",
    "borg-cli",
    "borg-gui",
]
# Note: borg-daemon is Unix-only (requires systemd, Unix sockets, etc.)
# On Windows, build with: cargo build --workspace --exclude borg-daemon

[workspace.package]
version = "0.5.0"
edition = "2024"
authors = ["Borg-Rust Contributors"]
license = "BSD-3-Clause"
repository = "https://github.com/borg-rust/borg-rust"
description = "High-performance backup solution with deduplication, encryption, and compression"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.44", features = ["full", "tracing"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Cryptography (RustCrypto)
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }

# Compression
zstd = "0.13"
lz4_flex = "0.11"
flate2 = "1.0"
lzma-rs = "0.3"

# Content-Defined Chunking
fastcdc = "3.1"

# IPC / Networking
tonic = "0.12"
prost = "0.13"
tower = "0.5"
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "brotli", "deflate", "rustls-tls"] }
url = { version = "2.5", features = ["serde"] }
bytes = "1.6"
tokio-util = { version = "0.7", features = ["io", "codec"] }
futures-util = "0.3"
quick-xml = { version = "0.31", features = ["serialize"] }

# Unix/Linux specifics
nix = { version = "0.29", features = ["fs", "user", "signal", "socket", "hostname"] }
libc = "0.2"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-journald = "0.3"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Regex
regex-lite = "0.1"

# File system & paths
walkdir = "2.5"
globset = "0.4"
notify = "7.0"

# SSH for remote repos
russh = "0.46"
russh-keys = "0.46"

# Database for local cache
sled = "0.34"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Config
toml = "0.8"
directories = "6.0"

# OpenDAL for native storage backends
opendal = { version = "0.50", features = ["services-webdav", "services-fs", "services-s3"] }

# Testing
tempfile = "3.14"
httpmock = "0.7"
