[workspace]
resolver = "2"
members = [
    "borg-core",
    "borg-daemon",
    "borg-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Borg-Rust Contributors"]
license = "BSD-3-Clause"
repository = "https://github.com/borg-rust/borg-rust"
description = "High-performance backup solution with deduplication, encryption, and compression"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.44", features = ["full", "tracing"] }
async-trait = "0.1"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Cryptography (RustCrypto)
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
argon2 = "0.5"
rand = "0.8"
zeroize = { version = "1.8", features = ["derive"] }

# Compression
zstd = "0.13"
lz4_flex = "0.11"
flate2 = "1.0"
lzma-rs = "0.3"

# Content-Defined Chunking
fastcdc = "3.1"

# IPC / Networking
tonic = "0.12"
prost = "0.13"
tower = "0.5"

# Unix/Linux specifics
nix = { version = "0.29", features = ["fs", "user", "signal", "socket", "hostname"] }
libc = "0.2"

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-journald = "0.3"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Regex
regex-lite = "0.1"

# File system & paths
walkdir = "2.5"
globset = "0.4"
notify = "7.0"

# SSH for remote repos
russh = "0.46"
russh-keys = "0.46"

# Database for local cache
sled = "0.34"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# Config
toml = "0.8"
directories = "6.0"

# Testing
tempfile = "3.14"
